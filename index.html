<head>
  <title>Lara</title>
  <link rel="stylesheet" href="index.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Homemade+Apple&family=Permanent+Marker&family=Rock+Salt&family=Special+Elite&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <div style="display: flex; width: 100%">
    <div class="color test1">marrom-escuro</div>
    <div class="color test2">marrom-medio</div>
    <div class="color test3">rosa-nude</div>
    <div class="color test4">verde-acinzentado</div>
    <div class="color test5">cinza-neutro</div>
    <div class="color test6">marfim</div>
    <div class="color test7">dourado</div>
    <div class="color test8">oliva</div>
    <div class="color test9">oliva-escuro</div>
    <div class="color test10">preto</div>
  </div>
  <div class="polaroid-flip-container">
    <div class="polaroid-flip-inner">
      <div class="polaroid-face polaroid-front">
        <img src="public/lara-now.jpg" />
        <div class="heart-wrapper">
          <div class="heart dark-heart"></div>
        </div>
      </div>
      <div class="polaroid-face polaroid-back">
        <img src="public/lara-then.jpg" />
        <div class="heart-wrapper">
          <div class="heart med-heart"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="song-container-wrapper">
    <div class="song-container">
      <span id="song-artist-name">Morissey</span>
      <span> – </span>
      <span id="song-name">Let Me Kiss You</span>
      <div class="song-btn-container">
        <button class="song-btn" id="prev-song-btn">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21 16.811c0 .864-.933 1.406-1.683.977l-7.108-4.061a1.125 1.125 0 0 1 0-1.954l7.108-4.061A1.125 1.125 0 0 1 21 8.689v8.122ZM11.25 16.811c0 .864-.933 1.406-1.683.977l-7.108-4.061a1.125 1.125 0 0 1 0-1.954l7.108-4.061a1.125 1.125 0 0 1 1.683.977v8.122Z"
            />
          </svg>
        </button>
        <button class="song-btn" id="play-song-btn">
          <svg
            id="play-icon"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z"
            />
          </svg>
          <svg
            id="pause-icon"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 5.25v13.5m-7.5-13.5v13.5"
            />
          </svg>
        </button>
        <button class="song-btn" id="next-song-btn">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3 8.689c0-.864.933-1.406 1.683-.977l7.108 4.061a1.125 1.125 0 0 1 0 1.954l-7.108 4.061A1.125 1.125 0 0 1 3 16.811V8.69ZM12.75 8.689c0-.864.933-1.406 1.683-.977l7.108 4.061a1.125 1.125 0 0 1 0 1.954l-7.108 4.061a1.125 1.125 0 0 1-1.683-.977V8.69Z"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>
  <img class="melon-collie" src="public/melon-collie.png" />
</body>
<script type="module" src="script/index.js"></script>
<script type="module" src="script/song.js"></script>
